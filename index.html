<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unmade Movies — Some ideas should be movies.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh}
a{color:inherit;text-decoration:none}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-bottom:1px solid #1e1e1e;position:sticky;top:0;background:rgba(10,10,10,0.95);backdrop-filter:blur(12px);z-index:100}
.nav-logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;letter-spacing:-0.5px}
.nav-logo span{background:linear-gradient(90deg,#e8315a,#ff6b2b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-links{display:flex;gap:28px;font-size:14px;font-weight:500;color:#aaa}
.nav-links a:hover{color:#fff}
.nav-cta{background:linear-gradient(135deg,#ff6b2b,#e8315a);color:#fff;padding:9px 20px;border-radius:100px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .2s}
.nav-cta:hover{opacity:0.85}

/* HERO */
.hero-wrapper{background:linear-gradient(135deg,#1a0010 0%,#2d0020 30%,#0a0a0a 70%,#0a0a0a 100%);position:relative;overflow:hidden}
.hero-wrapper::before{content:'';position:absolute;top:-200px;left:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(232,49,90,0.18) 0%,transparent 70%);pointer-events:none}
.hero-wrapper::after{content:'';position:absolute;bottom:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(255,107,43,0.1) 0%,transparent 70%);pointer-events:none}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding:80px 40px 60px;max-width:1200px;margin:0 auto;align-items:center;position:relative;z-index:1}
.hero-badge{display:inline-block;background:rgba(232,49,90,0.15);color:#e8315a;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 14px;border-radius:100px;border:1px solid rgba(232,49,90,0.3);margin-bottom:24px}
.hero h1{font-family:'Playfair Display',serif;font-size:58px;font-weight:900;line-height:1.05;letter-spacing:-1px;margin-bottom:20px}
.hero h1 em{background:linear-gradient(90deg,#e8315a,#ff6b2b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-style:normal}
.hero-sub{font-size:17px;color:#aaa;line-height:1.7;margin-bottom:32px}
.hero-bullets{list-style:none;margin-bottom:36px;display:flex;flex-direction:column;gap:10px}
.hero-bullets li{font-size:15px;color:#ccc;display:flex;align-items:center;gap:10px}
.hero-bullets li::before{content:'';width:6px;height:6px;background:linear-gradient(135deg,#e8315a,#ff6b2b);border-radius:50%;flex-shrink:0}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.btn-primary{background:linear-gradient(135deg,#ff6b2b,#e8315a);color:#fff;padding:13px 28px;border-radius:100px;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:opacity .2s;white-space:nowrap}
.btn-primary:hover{opacity:0.85}
.btn-secondary{background:transparent;color:#fff;padding:12px 28px;border-radius:100px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid #333;transition:border-color .2s}
.btn-secondary:hover{border-color:#666}
.btn-text{color:#aaa;font-size:14px;text-decoration:underline;cursor:pointer;margin-top:8px;display:block}
.btn-text:hover{color:#fff}

/* FORM CARD */
.form-card{background:#141414;border:1px solid #222;border-radius:20px;padding:36px}
.form-label-sm{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,#e8315a,#ff6b2b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;display:block}
.form-card h2{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;margin-bottom:8px}
.form-card p{font-size:14px;color:#888;margin-bottom:24px;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:12px 16px;font-size:14px;color:#f0f0f0;font-family:'Inter',sans-serif;transition:border-color .2s}
.form-input:focus{outline:none;border-color:#e8315a}
.form-input::placeholder{color:#555}
.thread-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.toggle-btn{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:10px;font-size:13px;color:#aaa;cursor:pointer;transition:all .2s;text-align:center}
.toggle-btn.active{background:rgba(232,49,90,0.12);border-color:#e8315a;color:#e8315a}
.genre-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.genre-pill{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:100px;padding:5px 12px;font-size:12px;color:#888;cursor:pointer;transition:all .2s}
.genre-pill.active,.genre-pill:hover{background:rgba(232,49,90,0.12);border-color:#e8315a;color:#e8315a}
.vibe-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.vibe-pill{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:100px;padding:5px 12px;font-size:12px;color:#888;cursor:pointer;transition:all .2s}
.vibe-pill:hover{background:rgba(255,107,43,0.1);border-color:#ff6b2b;color:#ff6b2b}
textarea.form-input{resize:vertical;min-height:100px}
.legal-check{display:flex;align-items:flex-start;gap:10px;margin:14px 0;font-size:12px;color:#666;line-height:1.5}
.legal-check input{margin-top:2px;accent-color:#e8315a;flex-shrink:0}
.form-btns{display:flex;gap:10px;margin-top:4px}
.form-btn-primary{flex:1;background:linear-gradient(135deg,#ff6b2b,#e8315a);color:#fff;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.form-btn-primary:hover{opacity:0.85}
.form-btn-secondary{flex:1;background:#1a1a1a;color:#aaa;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #2a2a2a}
